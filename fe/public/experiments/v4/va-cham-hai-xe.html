o khối lượng và vận tốc ban đầu."></canvas></section><section class="neviad-displays" aria-label="Kết quả mô phỏng"><div id="display-mass1_readout" data-display-id="mass1_readout" data-display-kind="numeric_readout" aria-label="Khối lượng xe hàng thứ nhất, kilôgam"><strong>Khối lượng xe 1</strong><output data-display-value="mass1_readout">—</output><span>kg</span></div><div id="display-mass2_readout" data-display-id="mass2_readout" data-display-kind="numeric_readout" aria-label="Khối lượng xe hàng thứ hai, kilôgam"><strong>Khối lượng xe 2</strong><output data-display-value="mass2_readout">—</output><span>kg</span></div><div id="display-velocity1_readout" data-display-id="velocity1_readout" data-display-kind="numeric_readout" aria-label="Vận tốc ban đầu của xe hàng thứ nhất, mét trên giây"><strong>Vận tốc ban đầu xe 1</strong><output data-display-value="velocity1_readout">—</output><span>m/s</span></div><div id="display-velocity2_readout" data-display-id="velocity2_readout" data-display-kind="numeric_readout" aria-label="Vận tốc ban đầu của xe hàng thứ hai, mét trên giây"><strong>Vận tốc ban đầu xe 2</strong><output data-display-value="velocity2_readout">—</output><span>m/s</span></div><div id="display-shared_velocity_readout" data-display-id="shared_velocity_readout" data-display-kind="numeric_readout" aria-label="Vận tốc chung của hai xe sau va chạm, mét trên giây; dấu cho biết hướng chuyển động"><strong>Vận tốc chung sau va chạm</strong><output data-display-value="shared_velocity_readout">—</output><span>m/s</span></div></section></main></div></article><script data-source-file="src/physics-model.js">
(function () {
  "use strict";
  var api = window.NEVIADExperiment || (window.NEVIADExperiment = {});
  var defaults = { mass1: 2, mass2: 3, velocity1: 2, velocity2: -1 };
  var bounds = { mass1: [0.5, 10], mass2: [0.5, 10], velocity1: [-5, 5], velocity2: [-5, 5] };
  var ids = ["straight_rail", "left_rail_supports", "cargo_cart_1", "cart1_load_stack", "cart1_bumper", "cargo_cart_2", "cart2_load_stack", "cart2_bumper", "cart_coupling_latch", "cart2_coupling_socket"];
  function finite(n, fallback) { n = Number(n); return Number.isFinite(n) ? n : fallback; }
  function params(p) {
    p = p || {};
    var r = {};
    Object.keys(defaults).forEach(function (k) {
      var b = bounds[k], v = finite(p[k], defaults[k]);
      r[k] = Math.max(b[0], Math.min(b[1], v));
    });
    return r;
  }
  function object(id, kind, x, y, angle, vx, vy) { return { id: id, kind: kind, x: x, y: y, angle: angle, vx: vx, vy: vy }; }
  function setObjects(s) {
    var x1 = s.x1, x2 = s.x2, y = 0;
    s.objects = [
      object("straight_rail", "rail", 0, 0, 0, 0, 0),
      object("left_rail_supports", "supports", 0, 0, 0, 0, 0),
      object("cargo_cart_1", "cart", x1, y, 0, s.v1, 0),
      object("cart1_load_stack", "load", x1, y, 0, s.v1, 0),
      object("cart1_bumper", "bumper", x1 + 0.9, y, 0, s.v1, 0),
      object("cargo_cart_2", "cart", x2, y, 0, s.v2, 0),
      object("cart2_load_stack", "load", x2, y, 0, s.v2, 0),
      object("cart2_bumper", "bumper", x2 - 0.9, y, 0, s.v2, 0),
      object("cart_coupling_latch", "latch", (x1 + x2) / 2, y, 0, s.v1, 0),
      object("cart2_coupling_socket", "socket", x2 - 0.95, y, 0, s.v2, 0)
    ];
    return s;
  }
  function createInitialState(p) {
    var q = params(p);
    return setObjects(Object.assign({}, q, { time: 0, isRunning: false, phase: "ready", shared_velocity: null, x1: -2.2, x2: 2.2, v1: 0, v2: 0, collided: false }));
  }
  function start(old, p) {
    var q = params(p || old || {}), s = Object.assign({}, old || createInitialState(q));
    if (s.phase === "approaching" || s.phase === "stuck_together") { s.isRunning = true; return setObjects(s); }
    Object.assign(s, q, { time: 0, isRunning: true, phase: "approaching", shared_velocity: null, x1: -2.2, x2: 2.2, v1: q.velocity1, v2: q.velocity2, collided: false });
    return setObjects(s);
  }
  function step(old, dt, p) {
    var s = Object.assign({}, old || createInitialState(p));
    if (!s.isRunning) return setObjects(s);
    var q = params(p || s), t = Math.max(0, Math.min(0.1, finite(dt, 0)));
    s.time = finite(s.time, 0) + t;
    if (s.phase === "approaching") {
      var gap = (s.x2 - s.x1) - 2.2, rel = s.v1 - s.v2;
      if (rel > 0 && gap <= rel * t) {
        var hit = Math.max(0, Math.min(t, gap / rel));
        s.x1 += s.v1 * hit; s.x2 -= 0; // preserve integration ordering below
        s.x2 += s.v2 * hit;
        var contactCenter = (s.x1 + s.x2) / 2;
        s.x1 = contactCenter - 1.1; s.x2 = contactCenter + 1.1;
        var total = q.mass1 + q.mass2;
        s.shared_velocity = (q.mass1 * q.velocity1 + q.mass2 * q.velocity2) / total;
        s.v1 = s.shared_velocity; s.v2 = s.shared_velocity; s.phase = "stuck_together"; s.collided = true;
        var rest = t - hit; s.x1 += s.shared_velocity * rest; s.x2 += s.shared_velocity * rest;
      } else { s.x1 += s.v1 * t; s.x2 += s.v2 * t; }
    } else if (s.phase === "stuck_together") { s.x1 += s.v1 * t; s.x2 += s.v2 * t; }
    return setObjects(s);
  }
  function calculateOutputs(s, p) {
    var q = params(p || s || {}), result = { mass1: q.mass1, mass2: q.mass2, velocity1: q.velocity1, velocity2: q.velocity2 };
    result.shared_velocity = s && s.phase === "stuck_together" && Number.isFinite(s.shared_velocity) ? s.shared_velocity : null;
    return result;
  }
  api.physicsModel = { createInitialState: createInitialState, start: start, step: step, calculateOutputs: calculateOutputs };
})();

(function () {
  "use strict";

  var experiment = window.NEVIADExperiment = window.NEVIADExperiment || {};

  function copyParameters(parameters) {
    return {
      mass1: Number(parameters.mass1),
      mass2: Number(parameters.mass2),
      velocity1: Number(parameters.velocity1),
      velocity2: Number(parameters.velocity2)
    };
  }

  function outputsFor(physical, parameters, model) {
    var result = model.calculateOutputs(physical, parameters) || {};
    return Object.assign({}, result);
  }

  function create(parameters, model) {
    var values = copyParameters(parameters || {});
    var physical = model.createInitialState(values);
    return {
      time: 0,
      parameters: values,
      physicalState: physical,
      outputs: outputsFor(physical, values, model),
      isRunning: false
    };
  }

  function step(state, dt, model) {
    if (!state.isRunning) return Object.assign({}, state);
    var physical = model.step(state.physicalState, dt, state.parameters);
    var running = physical.isRunning !== false;
    return {
      time: state.time + dt,
      parameters: Object.assign({}, state.parameters),
      physicalState: physical,
      outputs: outputsFor(physical, state.parameters, model),
      isRunning: running
    };
  }

  function setParameter(state, id, value, model) {
    var number = Number(value);
    if (!isFinite(number) || !Object.prototype.hasOwnProperty.call(state.parameters, id)) return Object.assign({}, state);
    var parameters = Object.assign({}, state.parameters);
    parameters[id] = number;
    return {
      time: state.time,
      parameters: parameters,
      physicalState: state.physicalState,
      outputs: outputsFor(state.physicalState, parameters, model),
      isRunning: state.isRunning
    };
  }

  function reset(state, model) {
    var parameters = Object.assign({}, state.parameters);
    var physical = model.createInitialState(parameters);
    return {
      time: 0,
      parameters: parameters,
      physicalState: physical,
      outputs: outputsFor(physical, parameters, model),
      isRunning: false
    };
  }

  function setRunning(state, running) {
    return Object.assign({}, state, { isRunning: !!running });
  }

  function dispatch(state, commandId, model) {
    if (commandId === "run_experiment") {
      var base = reset(state, model);
      var physical = model.start(base.physicalState, base.parameters);
      return {
        time: 0,
        parameters: base.parameters,
        physicalState: physical,
        outputs: outputsFor(physical, base.parameters, model),
        isRunning: true
      };
    }
    if (commandId === "reset_experiment") return reset(state, model);
    return Object.assign({}, state);
  }

  experiment.simulation = {
    create: create,
    step: step,
    setParameter: setParameter,
    reset: reset,
    setRunning: setRunning,
    dispatch: dispatch
  };
}());

(function () {
  'use strict';

  var COLORS = {
    skyTop: '#edf4f2', skyBottom: '#dce7e3', floor: '#c8c8bf', floorLine: '#aaa99f',
    steel: '#53636b', steelLight: '#aab8bd', steelDark: '#35434a', rail: '#56636a',
    accent: '#176b63', accentSoft: '#d7eee9', rubber: '#292e31', iron: '#41494c',
    ironHi: '#687276', wheel: '#252d31', brass: '#c49b58', white: '#f9fbfa', ink: '#233238'
  };

  var WORLD_H = 560;

  function finite(value, fallback) {
    return typeof value === 'number' && isFinite(value) ? value : fallback;
  }
  function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }
  function roundedRect(ctx, x, y, w, h, r) {
    var radius = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }
  function fillGradient(ctx, x, y, w, h, stops) {
    var g = ctx.createLinearGradient(0, y, 0, y + h);
    for (var i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
  }
  function line(ctx, x1, y1, x2, y2, color, width) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
  }
  function text(ctx, value, x, y, size, color, align, weight) {
    ctx.fillStyle = color; ctx.font = (weight || '600') + ' ' + size + 'px system-ui, sans-serif';
    ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.fillText(value, x, y);
  }
  function objectById(objects, id) {
    for (var i = 0; i < objects.length; i++) if (objects[i] && objects[i].id === id) return objects[i];
    return null;
  }
  function objectValue(object, key, fallback) { return finite(object && object[key], fallback); }
  function pathPoly(ctx, points, fill, stroke, width) {
    ctx.beginPath(); ctx.moveTo(points[0][0], points[0][1]);
    for (var i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = width || 1; ctx.stroke(); }
  }
  function drawBackdrop(ctx) {
    fillGradient(ctx, 0, 0, WORLD_W, WORLD_H, [[0, COLORS.skyTop], [0.72, COLORS.skyBottom], [1, '#d4ddd8']]);
    // Quiet workshop wall and distant structural panels.
    ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(0, 58, WORLD_W, 250);
    for (var x = 28; x < WORLD_W; x += 116) {
      line(ctx, x, 78, x, 298, 'rgba(76,98,99,0.08)', 1);
      line(ctx, x + 9, 88, x + 38, 88, 'rgba(255,255,255,0.38)', 2);
    }
    fillGradient(ctx, 0, 312, WORLD_W, 248, [[0, '#d7d7ce'], [0.12, '#c9c9bf'], [1, '#b9bbb4']]);
    line(ctx, 0, 313, WORLD_W, 313, '#a6aaa3', 2);
    // Floor seams establish scale without competing with equipment.
    for (var gx = 20; gx < WORLD_W; gx += 100) line(ctx, gx, 316, gx - 25, WORLD_H, 'rgba(95,101,97,0.09)', 1);
    for (var gy = 365; gy < WORLD_H; gy += 62) line(ctx, 0, gy, WORLD_W, gy, 'rgba(255,255,255,0.13)', 1);
    // Soft apparatus shadow.
    ctx.fillStyle = 'rgba(37,49,49,0.12)'; ctx.beginPath(); ctx.ellipse(500, 404, 370, 18, 0, 0, Math.PI * 2); ctx.fill();
  }
  function drawSupports(ctx) {
    var positions = [110, 258, 406, 554, 702, 850];
    for (var i = 0; i < positions.length; i++) {
      var x = positions[i];
      pathPoly(ctx, [[x - 19, 371], [x + 19, 371], [x + 12, 398], [x - 12, 398]], '#626d70', '#445055', 1.4);
      roundedRect(ctx, x - 25, 396, 50, 8, 3); fillGradient(ctx, x - 25, 396, 50, 8, [[0, '#b4bec0'], [1, '#59666b']]);
      roundedRect(ctx, x - 27, 401, 54, 5, 2); ctx.fillStyle = '#4e5a5e'; ctx.fill();
      line(ctx, x - 12, 378, x + 12, 378, 'rgba(235,241,241,0.55)', 1.5);
    }
  }
  function drawRails(ctx) {
    // Continuous twin rails, with raised polished running faces and dark web.
    for (var j = 0; j < 2; j++) {
      var y = j === 0 ? 346 : 366;
      ctx.fillStyle = 'rgba(22,32,35,0.12)'; ctx.fillRect(34, y + 7, 932, 5);
      fillGradient(ctx, 30, y, 940, 9, [[0, '#3d484c'], [0.28, '#79868a'], [0.52, '#4d5b60'], [1, '#313e43']]);
      ctx.fillStyle = '#b2bec0'; ctx.fillRect(30, y, 940, 2);
      ctx.fillStyle = 'rgba(230,237,236,0.42)'; ctx.fillRect(30, y + 2, 940, 1);
      for (var x = 48; x < 960; x += 38) {
        roundedRect(ctx, x, y + 8, 8, 4, 1); ctx.fillStyle = '#7b8586'; ctx.fill();
      }
    }
    // Cross ties beneath the rails, visible in the open spaces between supports.
    for (var k = 0; k < 23; k++) {
      var tx = 43 + k * 41;
      roundedRect(ctx, tx, 356, 26, 15, 3);
      fillGradient(ctx, tx, 356, 26, 15, [[0, '#967d61'], [0.45, '#726451'], [1, '#4e514b']]);
      ctx.strokeStyle = 'rgba(47,52,49,0.5)'; ctx.lineWidth = 1; ctx.stroke();
    }
  }
  function wheel(ctx, x, y) {
    ctx.save();
    ctx.shadowColor = 'rgba(20,27,29,0.25)'; ctx.shadowBlur = 3; ctx.shadowOffsetY = 2;
    var g = ctx.createRadialGradient(x - 3, y - 4, 2, x, y, 15);
    g.addColorStop(0, '#879397'); g.addColorStop(0.26, '#4a565b'); g.addColorStop(0.72, '#283136'); g.addColorStop(1, '#131b1e');
    ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.arc(x, y, 8.5, 0, Math.PI * 2); ctx.strokeStyle = '#101719'; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fillStyle = '#aab2b2'; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fillStyle = '#3d484c'; ctx.fill();
    line(ctx, x - 9, y + 1, x + 9, y + 1, 'rgba(205,216,216,0.3)', 1);
  }
  function drawLoad(ctx, centerX, deckY, mass, isFirst) {
    var count = Math.max(1, Math.min(5, Math.round(mass / 1.85)));
    var blockW = Math.min(36, 128 / count);
    var total = count * blockW + (count - 1) * 4;
    var start = centerX - total / 2;
    for (var i = 0; i < count; i++) {
      var h = 24 + (i % 2) * 5;
      var x = start + i * (blockW + 4), y = deckY - h;
      roundedRect(ctx, x, y, blockW, h, 3);
      fillGradient(ctx, x, y, blockW, h, [[0, '#737c7d'], [0.18, '#4e585b'], [0.58, '#323a3d'], [1, '#222a2d']]);
      ctx.fill(); ctx.strokeStyle = '#222a2d'; ctx.lineWidth = 1.2; ctx.stroke();
      line(ctx, x + 4, y + 3, x + blockW - 4, y + 3, 'rgba(216,225,224,0.28)', 1);
      // Foundry ribs make the cargo read as solid iron ingots.
      for (var rib = 1; rib < 3; rib++) line(ctx, x + rib * blockW / 3, y + 7, x + rib * blockW / 3, y + h - 5, 'rgba(16,22,24,0.3)', 1);
      roundedRect(ctx, x + 3, y + h - 8, blockW - 6, 3, 1); ctx.fillStyle = 'rgba(160,171,171,0.18)'; ctx.fill();
    }
    text(ctx, (isFirst ? 'm₁ ' : 'm₂ ') + mass.toFixed(1) + ' kg', centerX, deckY - 43, 12, '#f3f6f4', 'center', '700');
  }
  function drawCart(ctx, object, mass, id, isFirst, stuck) {
    if (!object) return;
    var x = objectValue(object, 'x', isFirst ? 320 : 650);
    var y = objectValue(object, 'y', 0);
    var angle = objectValue(object, 'angle', 0);
    var px = 500 + x * 58;
    var py = 0;
    // World coordinates from the model are interpreted by a fixed scale only.
    // The scene baseline is fixed; only the model record controls horizontal position.
    px = clamp(px, 145, 855);
    ctx.save(); ctx.translate(px, py); ctx.rotate(angle);
    var deckY = 315;
    // Delicate shadow is attached to the cart's record position.
    ctx.fillStyle = 'rgba(22,31,33,0.2)'; ctx.beginPath(); ctx.ellipse(0, 352, 91, 10, 0, 0, Math.PI * 2); ctx.fill();
    // Chassis side rails and end cross members.
    roundedRect(ctx, -82, 300, 164, 22, 5);
    fillGradient(ctx, -82, 300, 164, 22, [[0, '#b3bec0'], [0.2, '#6f7d82'], [0.56, '#46545a'], [1, '#2e3a40']]);
    ctx.strokeStyle = '#2a373d'; ctx.lineWidth = 2; ctx.stroke();
    line(ctx, -72, 304, 70, 304, 'rgba(239,245,243,0.55)', 1.5);
    // Structural underframe, visible below deck.
    roundedRect(ctx, -69, 321, 138, 10, 3); fillGradient(ctx, -69, 321, 138, 10, [[0, '#354248'], [0.4, '#849095'], [1, '#374349']]); ctx.fill();
    roundedRect(ctx, -54, 329, 108, 7, 2); ctx.fillStyle = '#4c595d'; ctx.fill();
    // Four wheels, paired in depth; slight offset suggests the far axle.
    wheel(ctx, -52, 346); wheel(ctx, 52, 346);
    ctx.globalAlpha = 0.67; wheel(ctx, -52, 337); wheel(ctx, 52, 337); ctx.globalAlpha = 1;
    // Axles and suspension brackets.
    for (var ax = -52; ax <= 52; ax += 104) {
      roundedRect(ctx, ax - 5, 324, 10, 19, 2); ctx.fillStyle = '#59676b'; ctx.fill();
      ctx.beginPath(); ctx.arc(ax, 346, 3, 0, Math.PI * 2); ctx.fillStyle = '#c2cbca'; ctx.fill();
    }
    // Cargo deck with repeated anti-slip ribs.
    roundedRect(ctx, -72, 292, 144, 12, 3); fillGradient(ctx, -72, 292, 144, 12, [[0, '#d2d9d8'], [0.36, '#819094'], [1, '#47565b']]); ctx.fill();
    ctx.strokeStyle = '#3d494e'; ctx.lineWidth = 1.4; ctx.stroke();
    for (var rib = -60; rib <= 60; rib += 12) line(ctx, rib, 295, rib, 301, 'rgba(39,49,53,0.5)', 1);
    // Corner stanchions and bolted steel frame.
    for (var side = -1; side <= 1; side += 2) {
      roundedRect(ctx, side * 72 - 5, 271, 10, 21, 2); fillGradient(ctx, side * 72 - 5, 271, 10, 21, [[0, '#b8c3c4'], [1, '#536267']]); ctx.fill();
      ctx.beginPath(); ctx.arc(side * 72, 307, 2.5, 0, Math.PI * 2); ctx.fillStyle = '#d5dedc'; ctx.fill();
    }
    drawLoad(ctx, 0, 290, mass, isFirst);
    // Identification plate, rivets, and cart number.
    roundedRect(ctx, -20, 309, 40, 12, 2); ctx.fillStyle = '#e1e5e2'; ctx.fill();
    text(ctx, isFirst ? '01' : '02', 0, 315, 8, '#35434a', 'center', '800');
    // Reinforced impact face and elastomer bumper, situated at the inward-facing end.
    var bumperX = isFirst ? 82 : -82;
    roundedRect(ctx, bumperX - 5, 282, 11, 28, 3);
    fillGradient(ctx, bumperX - 5, 282, 11, 28, [[0, '#50575a'], [0.3, '#202629'], [0.7, '#343b3e'], [1, '#161d20']]); ctx.fill();
    ctx.strokeStyle = '#11181b'; ctx.lineWidth = 1.2; ctx.stroke();
    line(ctx, bumperX + (isFirst ? 1 : -1), 286, bumperX + (isFirst ? 1 : -1), 306, 'rgba(187,194,193,0.3)', 1);
    // Visible velocity glyphs while moving; arrows communicate sign, never substitute for the carts.
    var velocity = finite(object.velocity, 0);
    if (Math.abs(velocity) > 0.04) {
      var direction = velocity > 0 ? 1 : -1;
      var arrowX = direction * 42;
      line(ctx, arrowX - direction * 19, 257, arrowX + direction * 19, 257, COLORS.accent, 3);
      pathPoly(ctx, [[arrowX + direction * 22, 257], [arrowX + direction * 12, 251], [arrowX + direction * 12, 263]], COLORS.accent, null, 0);
    }
    ctx.restore();
    return { x: px, y: py, bumperX: px + (isFirst ? 82 : -82), stuck: stuck };
  }
  function drawSocketAndLatch(ctx, cart1, cart2, state) {
    if (!cart1 || !cart2) return;
    var cx = (cart1.bumperX + cart2.bumperX) / 2;
    var y = 293;
    // Socket cup is fixed on cart 2's inward face and remains visible while open.
    roundedRect(ctx, cart2.bumperX - (cart2.bumperX > cart1.bumperX ? 9 : -1), y - 8, 12, 16, 3);
    fillGradient(ctx, cx - 6, y - 8, 12, 16, [[0, '#d5b678'], [0.5, '#8b6e3f'], [1, '#594a34']]);
    ctx.strokeStyle = '#50442f'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, y, 4, 0, Math.PI * 2); ctx.fillStyle = '#263237'; ctx.fill();
    if (state === 'stuck_together') {
      // Hooked steel latch visibly bridges the contact point only when model says joined.
      ctx.save(); ctx.translate(cx, y);
      roundedRect(ctx, -20, -3, 40, 6, 3); fillGradient(ctx, -20, -3, 40, 6, [[0, '#e4c47c'], [0.5, '#b38a49'], [1, '#74572e']]); ctx.fill();
      ctx.strokeStyle = '#564327'; ctx.lineWidth = 1; ctx.stroke();
      ctx.beginPath(); ctx.arc(18, 0, 7, -Math.PI / 2, Math.PI / 2); ctx.strokeStyle = '#b99151'; ctx.lineWidth = 4; ctx.stroke();
      ctx.beginPath(); ctx.arc(-15, 0, 3, 0, Math.PI * 2); ctx.fillStyle = '#efe0b9'; ctx.fill(); ctx.restore();
    }
  }
  function drawVelocityLegend(ctx, state, cart1, cart2) {
    var status = state.interactionState || state.status || state.phase || 'ready';
    var running = status === 'approaching' || state.isRunning === true;
    var joined = status === 'stuck_together';
    if (!running && !joined) return;
    var v1 = finite(state.velocity1, 0), v2 = finite(state.velocity2, 0);
    var y = 131;
    function arrowAt(x, velocity, label, color) {
      if (Math.abs(velocity) < 0.015) {
        line(ctx, x - 14, y, x + 14, y, '#73817f', 2);
        text(ctx, label + ' = 0 m/s', x, y - 15, 11, COLORS.ink, 'center', '700'); return;
      }
      var dir = velocity > 0 ? 1 : -1;
      line(ctx, x - dir * 22, y, x + dir * 22, y, color, 2.5);
      pathPoly(ctx, [[x + dir * 26, y], [x + dir * 17, y - 5], [x + dir * 17, y + 5]], color, null, 0);
      text(ctx, label + ' ' + (velocity > 0 ? '→' : '←'), x, y - 16, 11, COLORS.ink, 'center', '700');
    }
    if (!joined) {
      arrowAt(cart1.x, v1, 'v₁', COLORS.accent);
      arrowAt(cart2.x, v2, 'v₂', '#a45839');
    } else {
      var combined = finite(state.shared_velocity, 0);
      var mid = (cart1.x + cart2.x) / 2;
      arrowAt(mid, combined, 'v chung', COLORS.accent);
    }
  }
  function drawRailLabels(ctx) {
    roundedRect(ctx, 42, 82, 194, 34, 8); ctx.fillStyle = 'rgba(250,252,250,0.79)'; ctx.fill();
    ctx.strokeStyle = 'rgba(70,94,93,0.18)'; ctx.lineWidth = 1; ctx.stroke();
    text(ctx, 'MÔ HÌNH VA CHẠM MỀM', 139, 99, 12, '#33474a', 'center', '800');
    roundedRect(ctx, 752, 82, 206, 34, 8); ctx.fillStyle = 'rgba(250,252,250,0.79)'; ctx.fill();
    ctx.strokeStyle = 'rgba(70,94,93,0.18)'; ctx.stroke();
    text(ctx, 'CHIỀU DƯƠNG  →', 855, 99, 12, COLORS.accent, 'center', '800');
  }
  function draw(ctx, state, layout) {
    if (!ctx || !state || !layout) return;
    var width = finite(layout.width, ctx.canvas ? ctx.canvas.clientWidth : WORLD_W);
    var height = finite(layout.height, ctx.canvas ? ctx.canvas.clientHeight : WORLD_H);
    if (width <= 0 || height <= 0) return;
    var objects = state.physicalState && Array.isArray(state.physicalState.objects) ? state.physicalState.objects : [];
    var rail = objectById(objects, 'straight_rail');
    var supports = objectById(objects, 'left_rail_supports');
    var c1 = objectById(objects, 'cargo_cart_1');
    var c2 = objectById(objects, 'cargo_cart_2');
    var load1 = objectById(objects, 'cart1_load_stack');
    var load2 = objectById(objects, 'cart2_load_stack');
    var bumper1 = objectById(objects, 'cart1_bumper');
    var bumper2 = objectById(objects, 'cart2_bumper');
    var latch = objectById(objects, 'cart_coupling_latch');
    var socket = objectById(objects, 'cart2_coupling_socket');
    var sceneStatus = state.interactionState || state.status || state.phase || 'ready';
    var joined = sceneStatus === 'stuck_together' || !!(latch && latch.joined === true) || !!(c1 && c1.joined === true);
    var mass1 = finite(state.mass1, 2), mass2 = finite(state.mass2, 3);
    var scale = Math.min(width / WORLD_W, height / WORLD_H);
    var offsetX = (width - WORLD_W * scale) / 2, offsetY = (height - WORLD_H * scale) / 2;
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, width, height);
    ctx.translate(offsetX, offsetY); ctx.scale(scale, scale);
    drawBackdrop(ctx);
    // Approved static object records are checked explicitly; fixed scenic geometry is tied to their presence.
    if (supports || rail) drawSupports(ctx);
    if (rail) drawRails(ctx);
    drawRailLabels(ctx);
    var cart1Draw = drawCart(ctx, c1, finite(load1 && load1.mass, mass1), 'cargo_cart_1', true, joined);
    var cart2Draw = drawCart(ctx, c2, finite(load2 && load2.mass, mass2), 'cargo_cart_2', false, joined);
    // The bumper and coupling records provide joined/contact truth; object locations always come from cart records.
    var joinedRecord = (latch && latch.joined === true) || (socket && socket.engaged === true) || joined;
    drawSocketAndLatch(ctx, cart1Draw, cart2Draw, joinedRecord ? 'stuck_together' : sceneStatus);
    drawVelocityLegend(ctx, state, cart1Draw || { x: 320 }, cart2Draw || { x: 650 });
    // Contact glint makes the model-owned joined transition conspicuous without suggesting deformation.
    if (joinedRecord && cart1Draw && cart2Draw) {
      var contact = (cart1Draw.bumperX + cart2Draw.bumperX) / 2;
      ctx.beginPath(); ctx.arc(contact, 293, 13, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(196,155,88,0.55)'; ctx.lineWidth = 2; ctx.stroke();
    }
    // Subtle floor scale marks anchor the fixed camera and apparatus.
    for (var mark = 0; mark <= 10; mark++) {
      var mx = 90 + mark * 82;
      line(ctx, mx, 414, mx, mark % 2 === 0 ? 424 : 420, 'rgba(54,68,66,0.3)', 1);
    }
    ctx.restore();
  }

  window.NEVIADExperiment = window.NEVIADExperiment || {};
  window.NEVIADExperiment.renderer = { draw: draw };
})();

(function(){
  const config={"manifest":{"title":"Va chạm mềm giữa hai xe hàng","phenomenon":"Hai xe hàng chuyển động trên cùng đường ray, va chạm mềm rồi dính vào nhau; vận tốc chung sau va chạm phụ thuộc vào khối lượng và vận tốc ban đầu.","locale":"vi-VN","gradeBand":null,"learningObjectives":["Khám phá sự bảo toàn động lượng bằng cách thay đổi khối lượng và vận tốc ban đầu của hai xe rồi quan sát vận tốc chung sau va chạm.","Nhận biết chiều chuyển động qua dấu của vận tốc theo quy ước chiều dương từ trái sang phải."],"instructions":["Điều chỉnh khối lượng và vận tốc ban đầu của từng xe bằng các điều khiển.","Chọn Chạy thí nghiệm để quan sát hai xe tiến lại gần nhau, va chạm và dính vào nhau.","Sau khi va chạm, đọc vận tốc chung; giá trị dương chỉ chiều sang phải, giá trị âm chỉ chiều sang trái.","Thay đổi một hoặc nhiều giá trị rồi chạy lại để so sánh kết quả. Chọn Đặt lại thí nghiệm để đưa xe về vị trí xuất phát và xóa kết quả."],"assumptions":["Hai xe chuyển động trên cùng một đường ray thẳng; ngoại lực theo phương ray không đáng kể trong thời gian va chạm.","Va chạm mềm hoàn toàn: hai xe dính vào nhau ngay sau va chạm.","Khối lượng không đổi và bảo toàn động lượng áp dụng trong va chạm."],"safetyNotes":["Đây là mô phỏng giáo dục; không hướng dẫn thực hiện va chạm xe hàng thật.","Giữ các giá trị khối lượng dương trong phạm vi điều khiển để phép tính và mô hình có nghĩa."],"parameters":[{"id":"mass1","label":"Khối lượng xe 1","type":"number","unit":"kg","min":0.5,"max":10.0,"step":null,"defaultValue":2.0,"required":true},{"id":"mass2","label":"Khối lượng xe 2","type":"number","unit":"kg","min":0.5,"max":10.0,"step":null,"defaultValue":3.0,"required":true},{"id":"velocity1","label":"Vận tốc ban đầu xe 1","type":"number","unit":"m/s","min":-5.0,"max":5.0,"step":null,"defaultValue":2.0,"required":true},{"id":"velocity2","label":"Vận tốc ban đầu xe 2","type":"number","unit":"m/s","min":-5.0,"max":5.0,"step":null,"defaultValue":-1.0,"required":true}],"outputs":[{"id":"shared_velocity","label":"Vận tốc chung sau va chạm","kind":"value","unit":"m/s"}],"interactions":[{"id":"mass1","kind":"control","label":"Khối lượng xe 1"},{"id":"mass2","kind":"control","label":"Khối lượng xe 2"},{"id":"velocity1","kind":"control","label":"Vận tốc ban đầu xe 1"},{"id":"velocity2","kind":"control","label":"Vận tốc ban đầu xe 2"},{"id":"run_experiment","kind":"command","label":"Chạy thí nghiệm"},{"id":"reset_experiment","kind":"command","label":"Đặt lại thí nghiệm"}],"requiredSlots":["simulationViewport","controls","instructions","scene:straight_rail","scene:left_rail_supports","scene:cargo_cart_1","scene:cart1_load_stack","scene:cart1_bumper","scene:cargo_cart_2","scene:cart2_load_stack","scene:cart2_bumper","scene:cart_coupling_latch","scene:cart2_coupling_socket"],"optionalSlots":[]},"plan":{"physicsPlan":{"variables":[{"id":"mass1","label":"Khối lượng xe 1","unit":"kg","min":0.5,"max":10.0,"defaultValue":2.0},{"id":"mass2","label":"Khối lượng xe 2","unit":"kg","min":0.5,"max":10.0,"defaultValue":3.0},{"id":"velocity1","label":"Vận tốc ban đầu xe 1","unit":"m/s","min":-5.0,"max":5.0,"defaultValue":2.0},{"id":"velocity2","label":"Vận tốc ban đầu xe 2","unit":"m/s","min":-5.0,"max":5.0,"defaultValue":-1.0}],"signConvention":"Chọn chiều dọc ray từ trái sang phải là chiều dương; vận tốc dương hướng sang phải, vận tốc âm hướng sang trái.","assumptions":["Hai xe chuyển động trên cùng một đường ray thẳng; ngoại lực theo phương ray không đáng kể trong thời gian va chạm.","Va chạm mềm hoàn toàn: hai xe dính vào nhau ngay sau va chạm.","Khối lượng không đổi và bảo toàn động lượng áp dụng trong va chạm."],"initialState":{"mass1":2.0,"mass2":3.0,"velocity1":2.0,"velocity2":-1.0},"formulas":[{"id":"momentum_conservation_sticky","equation":"v_{after}=(m_1v_1+m_2v_2)/(m_1+m_2)","inputIds":["mass1","mass2","velocity1","velocity2"],"outputIds":["shared_velocity"]}],"derivedOutputs":[{"id":"shared_velocity","label":"Vận tốc chung sau va chạm","unit":"m/s","formulaId":"momentum_conservation_sticky"}]},"interactionPlan":{"controls":[{"id":"mass1","label":"Khối lượng xe 1","unit":"kg","binding":"mass1","min":0.5,"max":10.0,"defaultValue":2.0},{"id":"mass2","label":"Khối lượng xe 2","unit":"kg","binding":"mass2","min":0.5,"max":10.0,"defaultValue":3.0},{"id":"velocity1","label":"Vận tốc ban đầu xe 1","unit":"m/s","binding":"velocity1","min":-5.0,"max":5.0,"defaultValue":2.0},{"id":"velocity2","label":"Vận tốc ban đầu xe 2","unit":"m/s","binding":"velocity2","min":-5.0,"max":5.0,"defaultValue":-1.0}],"commands":[{"id":"run_experiment","label":"Chạy thí nghiệm"},{"id":"reset_experiment","label":"Đặt lại thí nghiệm"}],"transitions":[{"id":"start_collision_run","fromState":"ready","toState":"approaching","condition":"run_experiment được kích hoạt; hai xe bắt đầu chuyển động theo vận tốc ban đầu đã đặt","resetState":"Xóa kết quả lần chạy trước, đưa xe về vị trí xuất phát và dùng giá trị điều khiển hiện tại"},{"id":"carts_collide","fromState":"approaching","toState":"stuck_together","condition":"Hai xe gặp nhau trên ray; va chạm mềm làm chúng dính vào nhau và chuyển động cùng vận tốc","resetState":"Không áp dụng"},{"id":"reset_to_ready","fromState":"approaching|stuck_together","toState":"ready","condition":"Lệnh Đặt lại thí nghiệm được kích hoạt","resetState":"Đưa xe về vị trí xuất phát, xóa trạng thái va chạm và kết quả; giữ các giá trị điều khiển hiện tại"}],"pausedConditions":["Tạm dừng khi người dùng yêu cầu tạm dừng; giữ nguyên vị trí, vận tốc và trạng thái hiện tại.","Khi đang tạm dừng, không cập nhật chuyển động cho đến khi tiếp tục hoặc đặt lại."],"successConditions":["Hai xe đã va chạm mềm và dính vào nhau; hiển thị vận tốc chung sau va chạm được tính theo bảo toàn động lượng: (mass1*velocity1 + mass2*velocity2)/(mass1+mass2).","Người học thay đổi ít nhất một khối lượng hoặc vận tốc ban đầu, chạy lại thí nghiệm và quan sát được vận tốc chung tương ứng."],"failureConditions":["Không xác định được thời điểm va chạm hoặc hai xe không tiến
