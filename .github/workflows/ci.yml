name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        # A login shell, so the conda environment below is active in every step.
        shell: bash -el {0}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up the conda environment of the backend
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: be/environment.yml
          activate-environment: neviad-be
          auto-activate-base: false

      - name: Add PostgreSQL for the repository and migration tests
        run: conda install -y -c conda-forge postgresql

      # The draw-object and assembly gates and the STOMP compatibility test run the frontend's own Node scripts and client.
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix fe ci

      - name: Lint backend
        working-directory: be
        run: ruff check src tests

      - name: Run backend tests
        working-directory: be
        run: pytest

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix fe ci

      - name: Lint frontend
        run: npm --prefix fe run lint

      - name: Build frontend
        run: npm --prefix fe run build
