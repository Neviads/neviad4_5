spring.application.name=be-neviad-system
server.port=${APP_PORT:8080}

# PostgreSQL / Flyway
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# AI providers
app.ai.openai.api-key=${APP_AI_OPENAI_API_KEY:${OPENAI_API_KEY:}}
app.ai.openai.base-url=${APP_AI_OPENAI_BASE_URL:https://api.openai.com}
app.ai.openai.default-model=${APP_AI_OPENAI_DEFAULT_MODEL:gpt-6-luna}
# Iterative agents (generateWithTools with a tool budget) use /v1/responses so reasoning can stay on next to tools.
# Empty effort disables this path and falls back to Chat Completions with reasoning off.
app.ai.openai.agent.reasoning-effort=${APP_AI_OPENAI_AGENT_REASONING_EFFORT:medium}
# Tool-using calls (live code generation) reason deeper than the tool-less analysis call above.
app.ai.openai.agent.code-reasoning-effort=${APP_AI_OPENAI_AGENT_CODE_REASONING_EFFORT:high}
# The draw-object agent writes one short file per turn; "medium" keeps a turn well under the gateway's 60 s silent-request cut that "high" hits.
app.ai.openai.agent.draw-object-reasoning-effort=${APP_AI_OPENAI_AGENT_DRAW_OBJECT_REASONING_EFFORT:medium}
app.ai.openai.agent.max-output-tokens=${APP_AI_OPENAI_AGENT_MAX_OUTPUT_TOKENS:100000}
app.ai.openai.agent.request-timeout-seconds=${APP_AI_OPENAI_AGENT_REQUEST_TIMEOUT_SECONDS:900}
app.ai.deepseek.api-key=${APP_AI_DEEPSEEK_API_KEY:${DEEPSEEK_API_KEY:}}
app.ai.deepseek.base-url=${APP_AI_DEEPSEEK_BASE_URL:${DEEPSEEK_BASE_URL:https://api.deepseek.com}}
app.ai.deepseek.default-model=${APP_AI_DEEPSEEK_DEFAULT_MODEL:${DEEPSEEK_MODEL:deepseek-flash}}

# Dev only: exposes the code tools at /api/v1/codetools/debug. Unauthenticated; keep false outside a local machine.
app.livecode.debug=${APP_LIVECODE_DEBUG:false}

# Node scripts that check a drawn object and an assembly (fe/scripts/validate-*.mjs).
# Empty fe-root = fe or ../fe relative to the working directory.
app.pipeline.fe-root=${APP_PIPELINE_FE_ROOT:}
app.pipeline.node-command=${APP_PIPELINE_NODE_COMMAND:node}
app.pipeline.gate-timeout-seconds=${APP_PIPELINE_GATE_TIMEOUT_SECONDS:240}

# POST /api/v1/draw-object/headless: run the draw-object agent without the browser (tree read from disk, writes kept in memory) to draw
# one object from a fixed input, e.g. to compare two versions of the agent. Dev only; it calls the real model. Off by default.
app.draw-object.headless-enabled=${APP_DRAW_OBJECT_HEADLESS_ENABLED:false}

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui/index.html
